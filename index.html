 * SECTION-WISE REPORT
 * ===================================================================== */
function rviewToggle() {
  return `<div class="seg" role="group" aria-label="Report type">
    <button type="button" class="${S.rview !== 'section' ? 'on' : ''}" data-act="rview" data-v="detail">Detailed</button>
    <button type="button" class="${S.rview === 'section' ? 'on' : ''}" data-act="rview" data-v="section">Section-wise</button>
  </div>`;
}

function secMonthList() {
  const m = (S.secMonths || []).filter(x => S.months.indexOf(x) >= 0);
  return (m.length ? m : [S.month]).slice().sort();     // oldest first
}

function secSummaryText() {
  const m = secMonthList().slice().reverse();
  if (m.length === 1) return monthLabel(m[0]);
  if (m.length === S.months.length) return 'All months (' + m.length + ')';
  if (m.length === 2) return m.map(monthLabel).join(', ');
  return m.length + ' months selected';
}

/* true when every selected month is in memory; otherwise starts loading and repaints when done */
function secEnsure() {
  const missing = secMonthList().filter(m => !S.cache[m]);
  if (!missing.length) return true;
  if (!S.secLoading) {
    S.secLoading = true;
    Promise.all(missing.map(m => api('api_list', S.auth, m).then(l => { if (!S.cache[m]) S.cache[m] = l; })))
      .catch(e => { toast(e.message, true); S.secMonths = [S.month]; })
      .then(() => { S.secLoading = false; if (S.tab === 'report') { syncSec(); } });
  }
  return false;
}

function secStat(L, name) {
  const now = Date.now();
  const r = { section: name, total: L.length, verified: 0, review: 0, returned: 0, pending: 0, answered: 0, retQ: 0, retCount: 0 };
  const ans = [];
  let oldest = -1, oldDivs = [];
  L.forEach(o => {
    if (o.stage === 'verified') r.verified++;
    else if (o.stage === 'awaiting_review') r.review++;
    else if (o.stage === 'returned') r.returned++;
    else r.pending++;
    const hasAns = !!String(o.answer || '').trim();
    if (hasAns) r.answered++;
    const rc = Math.max(Number(o.returnCount) || 0, o.stage === 'returned' ? 1 : 0);
    if (rc > 0) r.retQ++;
    r.retCount += rc;
    const q = parseQDate(o.queryDate), a = parseQDate(o.answeredOn);
    if (hasAns && q && a) ans.push(Math.max(0, (a - q) / 86400000));
    if (o.stage === 'awaiting_answer' && q) {
      const days = Math.max(0, Math.floor((now - q) / 86400000));
      if (days > oldest) { oldest = days; oldDivs = [o.division]; }
      else if (days === oldest && oldDivs.indexOf(o.division) < 0) oldDivs.push(o.division);
    }
  });
  const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
  r.avgAns = avg(ans);
  r.oldest = oldest >= 0 ? oldest : null;
  r.oldDivs = oldDivs;
  return r;
}

function secData() {
  const months = secMonthList(), div = S.f.division || '', prov = S.f.province || '';
  const all = [].concat.apply([], months.map(m => (S.cache[m] || []).filter(o => (!div || o.division === div) && (!prov || provOf(o.division) === prov))));
  const names = S.sections.slice();
  all.forEach(o => { if (names.indexOf(o.section) < 0) names.push(o.section); });
  return {
    months: months, div: div, prov: prov, names: names, all: all,
    rows: names.map(n => secStat(all.filter(o => o.section === n), n)),
    total: secStat(all, 'All sections')
  };
}

function n1(v) { return v == null ? '—' : String(Math.round(v * 10) / 10); }
function pc(a, b) { return b ? Math.round(a / b * 100) + '%' : '—'; }

function secHtml(D) {
  const row = (r, cls) => {
    return `<tr class="${cls || ''}"><td>${esc(r.section)}</td>
      <td class="num">${r.total}</td><td class="num">${r.verified}</td><td class="num">${r.review}</td>
      <td class="num">${r.returned}</td><td class="num">${r.pending}</td>
      <td class="num">${pc(r.verified, r.total)}</td><td class="num">${r.retCount}</td>
      <td class="num">${n1(r.avgAns)}</td>
      <td class="num">${r.oldest == null ? '—' : r.oldest}${r.oldest != null && !D.div && r.oldDivs.length ? `<div class="sub">${esc(r.oldDivs.length <= 2 ? r.oldDivs.join(', ') : r.oldDivs.length + ' divisions')}</div>` : ''}</td></tr>`;
  };

  const summary = `
    <h3 class="sech">Section summary</h3>
    <div class="rscroll"><table class="rtable sectable">
      <thead><tr><th>Section</th><th class="num">Total</th><th class="num">Resolved</th><th class="num">In review</th>
        <th class="num">Returned</th><th class="num">Pending</th><th class="num">Resolved %</th>
        <th class="num">Times returned</th><th class="num">Avg days to answer</th>
        <th class="num">Oldest pending (days)</th></tr></thead>
      <tbody>${D.rows.map(r => row(r)).join('')}${row(D.total, 'tot')}</tbody>
    </table></div>
    <p class="meta">Times returned = how many times the senior sent answers back. It only counts from the day the Return Count column was added.
      Avg days to answer = query date to latest answer.</p>`;

  return summary;
}

function secMonthDropdown() {
  const months = secMonthList();
  const checks = S.months.slice().sort().reverse().map(m =>
    `<label><input type="checkbox" class="sm" value="${m}"${months.indexOf(m) >= 0 ? ' checked' : ''}>${esc(monthLabel(m))}</label>`).join('');
  return `<details class="msel" id="sMsel">
      <summary id="sMsum" aria-label="Months">${esc(secSummaryText())}</summary>
      <div class="mpanel">${checks}
        <div class="mact">
          <button type="button" class="btn plain" data-act="sec-all">Select all</button>
          <button type="button" class="btn plain" data-act="sec-one">Latest only</button>
        </div>
      </div>
    </details>`;
}

function renderSecReport() {
  const role = S.user.role;
  const divSel = role === 'Division' ? '' : `
    <select id="rProv" aria-label="Province"><option value="">All provinces</option>
      ${provinceList().map(p => `<option${p === S.f.province ? ' selected' : ''}>${esc(p)}</option>`).join('')}
    </select>
    <select id="rDiv" aria-label="Division"><option value="">${S.f.province ? 'All divisions in ' + esc(S.f.province) : 'All divisions'}</option>
      ${divsOfProvince(S.f.province).map(d => `<option${d.division === S.f.division ? ' selected' : ''}>${esc(d.division)}</option>`).join('')}
    </select>`;
  $('#view').innerHTML = `
    <h2>EMR Compliance Report: Section-wise</h2>
    <p class="lede">Compare sections: status, speed, returns and oldest pending query.</p>
    ${rviewToggle()}
    <div class="filters">
      ${divSel}${secMonthDropdown()}
      <button class="btn primary" data-act="print">Print report</button>
      <button class="btn" data-act="csv">Download CSV</button>
    </div>
    <div id="secout"></div>`;
  paintSec();
}

function paintSec() {
  const box = $('#secout');
  if (!box || S.tab !== 'report' || S.rview !== 'section') return;
  if (!secEnsure()) { box.innerHTML = '<p class="muted">Loading…</p>'; return; }
  box.innerHTML = secHtml(secData());
}

function syncSec() {
  const months = secMonthList();
  document.querySelectorAll('.sm').forEach(x => { x.checked = months.indexOf(x.value) >= 0; });
  const sm = $('#sMsum'); if (sm) sm.textContent = secSummaryText();
  if (S.rview === 'section') paintSec(); else paintRep();
}

function printSec() {
  if (!secEnsure()) return toast('Months are still loading. Try again in a moment.', true);
  const D = secData();
  const w = window.open('', '_blank');
  if (!w) return toast('Allow pop-ups for this page, then press Print report again.', true);
  w.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><title>EMR Section-wise Report</title>
    <style>
      *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
      body{font:12px/1.45 'IBM Plex Sans','Noto Naskh Arabic',Tahoma,sans-serif;color:#111;margin:20px}
      h1{font-size:19px;margin:0 0 2px} .sub{color:#555;margin:0 0 12px} h3{font-size:14px;margin:18px 0 4px;break-after:avoid}
      table{width:100%;border-collapse:collapse;margin-bottom:8px}
      th,td{border:1px solid #bbb;padding:4px 6px;text-align:left;vertical-align:top} th{background:#eee}
      td.num,th.num{text-align:right} tr{break-inside:avoid} tr.tot td{font-weight:700;background:#eee}
      .c-verified{background:#2E7D4F}.c-review{background:#C98A12}.c-returned{background:#B4432F}.c-awaiting{background:#8C99A8}
      .meta,.muted{color:#555;font-size:11px} .sub{display:block;color:#555;font-size:10px;font-weight:400}
    </style></head><body>
    <h1>EMR Compliance: Section-wise Report</h1>
    <p class="sub">Dawat-e-Islami Trust. ${esc(secSummaryText())}${repScope(D.div, D.prov) ? ', ' + esc(repScope(D.div, D.prov)) : ', all divisions'}</p>
    ${secHtml(D).replace(/class="rscroll"/g, '')}
    </body></html>`);
  w.document.close();
  w.focus();
  setTimeout(() => w.print(), 400);
}

function downloadSecCsv() {
  if (!secEnsure()) return toast('Months are still loading. Try again in a moment.', true);
  const D = secData();
  const cell = csvCell;
  const lines = [];
  const push = a => lines.push(a.map(cell).join(','));
  const num = v => v == null ? '' : Math.round(v * 10) / 10;

  push(['Section summary', secSummaryText(), repScope(D.div, D.prov) || 'All divisions']);
  push(['Section', 'Total', 'Resolved', 'In review', 'Returned', 'Pending Answer', 'Resolved %', 'Times returned',
        'Avg days to answer', 'Oldest pending (days)', 'Oldest pending division']);
  D.rows.concat([D.total]).forEach(r => push([r.section, r.total, r.verified, r.review, r.returned, r.pending,
    r.total ? Math.round(r.verified / r.total * 100) : '', r.retCount,
    num(r.avgAns), r.oldest == null ? '' : r.oldest, r.oldest == null ? '' : r.oldDivs.join(' / ')]));

  const blob = new Blob(['\uFEFF' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'EMR_Section_Report_' + D.months[0] + (D.months.length > 1 ? '_to_' + D.months[D.months.length - 1] : '') +
    ((D.div || D.prov) ? '_' + (D.div || D.prov).replace(/\s+/g, '') : '') + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

const savedAuth = loadAuth();
if (savedAuth && savedAuth.token) {
  $('#app').innerHTML = '<p class="muted" style="padding:24px">Loading…</p>';
  startSession(savedAuth).catch(e => {
    clearAuth();
    showLogin(e && /expired|sign in/i.test(e.message) ? 'Session expired. Please sign in again.' : '');
  });
} else {
  showLogin();
}
</script>
</body>
</html>
