<!DOCTYPE html>
<!--
  EMR COMPLIANCE DASHBOARD
  Developed by: Bluemoonways | info.bluemoonways@gmail.com
  Version 1.1 | October 2026
-->
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EMR Compliance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Naskh+Arabic:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F3F5F8;
    --surface: #FFFFFF;
    --ink: #14202E;
    --muted: #5B6A7A;
    --line: #DCE1E8;
    --navy: #1D3557;
    --verified: #2E7D4F;
    --review: #C98A12;
    --returned: #B4432F;
    --waiting: #8C99A8;
    --verified-bg: #E4F2E9;
    --review-bg: #FBF0D6;
    --returned-bg: #F8E3DE;
    --waiting-bg: #E9EDF2;
    --focus: #2F6FEB;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font: 15px/1.55 'IBM Plex Sans', 'Noto Naskh Arabic', 'Segoe UI', Tahoma, sans-serif;
    color: var(--ink);
    background: var(--paper);
  }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  button { font: inherit; }
  .muted { color: var(--muted); }
  .hidden { display: none !important; }

  /* ---------- sign in ---------- */
  .login { max-width: 400px; margin: 12vh auto 0; padding: 0 20px; }
  .login { text-align: center; }
  .login .org { color: var(--navy); font-weight: 600; font-size: 16px; }
  .login .logo { display: block; width: 96px; height: 96px; margin: 0 auto 14px; }
  .login h1 { font-size: 28px; font-weight: 600; color: var(--navy); margin: 0 0 4px; }
  .login p { margin: 0 0 28px; color: var(--muted); }
  .login label, .login .err { text-align: left; }
  .login .btn { width: 100%; padding: 10px 14px; }
  .login label { display: block; font-weight: 500; margin: 0 0 6px; }
  .login .row { margin-bottom: 16px; }
  .err { color: var(--returned); min-height: 1.5em; margin: 4px 0 12px; font-size: 14px; }

  /* developer credit */
  .login p.devcredit, .devcredit { margin: 28px 0 0; font-size: 12.5px; color: var(--muted); text-align: center; }
  .devcredit a, .appfoot a { color: var(--muted); }
  .appfoot { max-width: 1120px; margin: 0 auto; padding: 0 20px 30px; font-size: 12px; color: var(--muted); text-align: center; }

  /* ---------- controls ---------- */
  input, select, textarea {
    font: inherit; color: inherit; background: #fff;
    border: 1px solid #C5CDD8; border-radius: 6px; padding: 8px 10px;
  }
  input[type=text], input[type=password], input[type=search], input[type=month] { width: 100%; }
  textarea { width: 100%; min-height: 88px; resize: vertical; }
  .btn {
    border: 1px solid #C5CDD8; background: #fff; color: var(--ink);
    padding: 7px 14px; border-radius: 6px; cursor: pointer; font-weight: 500;
  }
  .btn:hover { background: #F0F3F7; }
  .btn:disabled { opacity: .55; cursor: default; }
  .btn.primary { background: var(--navy); border-color: var(--navy); color: #fff; }
  .btn.primary:hover { background: #162B48; }
  .btn.good { background: var(--verified); border-color: var(--verified); color: #fff; }
  .btn.good:hover { background: #256740; }
  .btn.danger { color: var(--returned); border-color: #DDB3AA; }
  .btn.plain { border-color: transparent; background: none; color: var(--navy); padding-left: 6px; padding-right: 6px; }
  .btn.plain:hover { background: #E8EDF4; }

  /* ---------- shell ---------- */
  .topbar { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
  .topin { max-width: 1120px; margin: 0 auto; padding: 12px 20px 0; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  .brand { display: flex; flex-direction: column; line-height: 1.2; }
  .brand b { font-size: 17px; font-weight: 600; color: var(--navy); }
  .brand span { font-size: 12.5px; color: var(--muted); }
  .spacer { flex: 1; }
  .who { text-align: right; line-height: 1.25; }
  .brandwrap { display: flex; align-items: center; gap: 10px; }
  .toplogo { height: 46px; width: 46px; display: block; flex: none; }
  .who b { font-weight: 600; }
  .who span { display: block; font-size: 12.5px; color: var(--muted); }
  .monthbox { display: flex; align-items: center; gap: 8px; }
  .monthbox label { font-size: 13px; color: var(--muted); }
  .tabs { max-width: 1120px; margin: 0 auto; padding: 4px 14px 0; display: flex; gap: 2px; overflow-x: auto; }
  .tab {
    border: 0; background: none; padding: 10px 12px; font-weight: 500; color: var(--muted);
    border-bottom: 3px solid transparent; cursor: pointer; white-space: nowrap;
  }
  .tab:hover { color: var(--ink); }
  .tab[aria-selected=true] { color: var(--navy); border-bottom-color: var(--navy); }
  main { max-width: 1120px; margin: 0 auto; padding: 26px 20px 90px; }
  h2 { font-size: 20px; font-weight: 600; margin: 0 0 6px; }
  .lede { max-width: 62ch; color: var(--muted); margin: 0 0 18px; }

  /* ---------- dashboard ---------- */
  .stats-title { font-size: 14px; color: var(--muted); margin: 0 0 10px; }
  .stats { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; margin: 0 0 22px; }
  .stat {
    background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--waiting);
    border-radius: 8px; padding: 14px 16px;
  }
  button.stat { font: inherit; color: inherit; text-align: left; cursor: pointer; width: 100%; }
  button.stat:hover { background: #F0F3F7; }
  .stat .num { font-size: 30px; font-weight: 600; line-height: 1.1; color: var(--ink); }
  .stat .lbl { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .stat.total    { border-top-color: var(--navy); }
  .stat.verified { border-top-color: var(--verified); }
  .stat.review   { border-top-color: var(--review); }
  .stat.returned { border-top-color: var(--returned); }
  .stat.awaiting { border-top-color: var(--waiting); }
  .stat.aging    { border-top-color: #6B4FA0; }
  .stat.aging .num { color: #6B4FA0; }
  .stat .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .stat.verified .num { color: var(--verified); }
  .stat.review .num   { color: var(--review); }
  .stat.returned .num { color: var(--returned); }
  .stat.zero .num { color: #B5BFCB; }

  .legend { display: flex; gap: 18px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin: 0 0 6px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
  .prow {
    display: grid; grid-template-columns: 210px 1fr 280px; gap: 18px; align-items: center;
    width: 100%; text-align: left; color: inherit; cursor: pointer;
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
    margin: 0 0 8px; padding: 12px 16px;
  }
  .prow:hover { background: #F0F3F7; }
  .pname b { font-weight: 600; }
  .pname span { display: block; font-size: 12.5px; color: var(--muted); }
  .bar { display: flex; height: 10px; background: var(--waiting-bg); border-radius: 5px; overflow: hidden; }
  .bar span { display: block; height: 100%; }
  .pnums { display: flex; gap: 14px; font-size: 13.5px; flex-wrap: wrap; }
  .pnums span { white-space: nowrap; }
  .pnums b { font-weight: 600; }
  .dim { opacity: .55; }
  .c-verified { background: var(--verified); }
  .c-review { background: var(--review); }
  .c-returned { background: var(--returned); }
  .c-awaiting { background: var(--waiting); }

  /* ---------- section pie chart ---------- */
  .pietable { flex: 1; min-width: 300px; border-collapse: collapse; font-size: 14px; }
  .pietable th { text-align: left; font-size: 12px; font-weight: 600; letter-spacing: .6px; text-transform: uppercase; color: var(--muted); padding: 8px 10px; border-bottom: 2px solid var(--line); }
  .pietable td { padding: 9px 10px; border-bottom: 1px solid var(--line); }
  .pietable .num { text-align: right; white-space: nowrap; }
  .pietable tbody tr:nth-child(even) { background: #F3F6FA; }
  .pietable tr[data-act] { cursor: pointer; }
  .pietable tr[data-act]:hover { background: #E8EDF4; }
  .pietable i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 8px; vertical-align: -1px; }
  .pietable tr.tot td { font-weight: 600; background: #fff; border-top: 2px solid var(--line); border-bottom: 0; }
  .pietable tr.othsub td:first-child { padding-left: 34px; color: var(--muted); }
  .pietable .arrow { display: inline-block; margin-left: 6px; font-size: 11px; color: var(--muted); transition: transform .15s; }
  .pietable tr.open .arrow { transform: rotate(180deg); }
  .piebox { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin-top: 14px; }
  .piebox h4 { margin: 0 0 12px; font-size: 14px; font-weight: 600; color: var(--muted); }
  .piewrap { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; }
  .piewrap svg { width: 300px; height: 300px; flex: none; max-width: 100%; }
  .pieleg { flex: 1; min-width: 240px; display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 4px 14px; }
  .pieleg button {
    display: flex; align-items: center; gap: 8px; text-align: left; border: 0; background: none;
    padding: 5px 8px; border-radius: 6px; cursor: pointer; color: var(--ink); font-size: 13.5px;
  }
  .pieleg button:hover { background: #F0F3F7; }
  .pieleg i { width: 11px; height: 11px; border-radius: 2px; flex: none; }
  .pieleg .pn { flex: 1; }
  .pieleg .pv { font-weight: 600; white-space: nowrap; }
  .pieleg .pp { color: var(--muted); font-size: 12px; min-width: 38px; text-align: right; }

  svg.colchart { display: block; width: 100%; height: auto; }
  .gchart .legend { margin: 0 0 12px; }
  .rkstats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 14px 0 18px; }
  .stat .num.sm { font-size: 20px; line-height: 1.3; }
  .rk {
    display: grid; grid-template-columns: 40px 190px 1fr 190px; gap: 14px; align-items: center;
    width: 100%; text-align: left; color: inherit; font: inherit;
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px; margin: 0 0 8px; padding: 12px 16px;
  }
  button.rk { cursor: pointer; }
  button.rk:hover { background: #F0F3F7; }
  .rkn {
    width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-weight: 600; font-size: 14px; background: var(--waiting-bg); color: var(--muted);
  }
  .rkn.r1 { background: #C9A227; color: #fff; }
  .rkn.r2 { background: #9AA5B1; color: #fff; }
  .rkn.r3 { background: #B87333; color: #fff; }
  .rkbar { height: 12px; background: var(--waiting-bg); border-radius: 6px; overflow: hidden; }
  .rkbar span { display: block; height: 100%; background: var(--verified); }
  .rkv { font-size: 13px; color: var(--muted); line-height: 1.35; }
  .rkv b { display: block; font-size: 18px; color: var(--ink); font-weight: 600; }
  .rkv span { display: block; }
  .rkv .rks { font-size: 11.5px; }
  .mchips { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 0 0 18px; }
  .mchips .lbl { font-size: 13px; color: var(--muted); margin-right: 2px; }
  .mchips label { display: inline-flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 13.5px; cursor: pointer; }
  .mchips label:has(input:checked) { border-color: var(--navy); background: #E8EDF4; color: var(--navy); font-weight: 500; }
  .mblock { margin: 0 0 30px; }
  .seg { display: inline-flex; border: 1px solid #C5CDD8; border-radius: 6px; overflow: hidden; margin: 0 0 8px; }
  .seg button { border: 0; background: #fff; padding: 7px 16px; cursor: pointer; font-weight: 500; color: var(--muted); }
  .seg button.on { background: var(--navy); color: #fff; }
  .sectable { font-size: 13.5px; }
  .sectable td.num, .sectable th.num { text-align: right; white-space: nowrap; }
  .sectable tr.tot td { font-weight: 600; background: #EDF0F4; }
  .sectable .sub { font-size: 11.5px; color: var(--muted); font-weight: 400; white-space: normal; }
  .sech { margin: 26px 0 4px; font-size: 17px; }
  details.msel { position: relative; }
  details.msel > summary {
    list-style: none; cursor: pointer; background: #fff; border: 1px solid #C5CDD8; border-radius: 6px;
    padding: 8px 34px 8px 10px; min-width: 200px; position: relative; user-select: none;
  }
  details.msel > summary::-webkit-details-marker { display: none; }
  details.msel > summary::after { content: ''; position: absolute; right: 12px; top: 50%; width: 7px; height: 7px; margin-top: -6px; border-right: 2px solid #555; border-bottom: 2px solid #555; transform: rotate(45deg); }
  details.msel[open] > summary { border-color: var(--navy); }
  .mpanel {
    position: absolute; left: 0; top: calc(100% + 4px); z-index: 8; min-width: 240px; max-height: 340px; overflow-y: auto;
    background: #fff; border: 1px solid #C5CDD8; border-radius: 8px; box-shadow: 0 6px 20px rgba(20,32,46,.15); padding: 6px;
  }
  .mpanel label { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 6px; cursor: pointer; }
  .mpanel label:hover { background: #F0F3F7; }
  .mpanel input[type=checkbox] { flex: none; width: 16px; height: 16px; min-width: 0; max-width: none; padding: 0; margin: 0; }
  .mpanel label { white-space: nowrap; }
  .mact { display: flex; gap: 6px; border-top: 1px solid var(--line); margin-top: 6px; padding-top: 6px; }

  /* ---------- filters & list ---------- */
  .filters { display: flex; gap: 10px; flex-wrap: wrap; margin: 14px 0 6px; }
  .filters select { max-width: 240px; }
  .filters input { flex: 1; min-width: 180px; max-width: 320px; }
  .count { font-size: 13px; color: var(--muted); margin: 6px 0 0; }
  .qitem { padding: 18px 0 20px; border-bottom: 1px solid var(--line); }
  .qhead { display: flex; gap: 14px; justify-content: space-between; align-items: flex-start; }
  .qwho { font-size: 13px; color: var(--muted); }
  .qwho b { color: var(--navy); font-weight: 600; margin-right: 10px; }

  /* Text Labels */
  .field-label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--muted);
    margin-top: 12px;
    margin-bottom: 4px;
  }
  .label-query { color: var(--muted); }
  .label-verified { color: var(--verified) !important; }
  .label-pending { color: var(--review) !important; }
  .label-returned { color: var(--returned) !important; }

  /* TEXT WRAPPERS (clean look, no backgrounds/borders) */
  .qtext, .answer-text {
    font-size: 16px;
    margin: 2px 0 12px;
    white-space: pre-wrap;
    max-width: 78ch;
    font-weight: 500;
    color: var(--ink);
    padding: 0;
    border: none;
    background: none;
  }

  .chip { font-size: 12.5px; font-weight: 600; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
  .chip.verified { color: #1B5E3A; background: var(--verified-bg); }
  .chip.review { color: #8A5B00; background: var(--review-bg); }
  .chip.returned { color: #8E2F1F; background: var(--returned-bg); }
  .chip.waiting { color: #435163; background: var(--waiting-bg); }

  .note { border-left: 3px solid var(--returned); background: var(--returned-bg); padding: 6px 10px; margin: 0 0 10px; font-size: 14px; max-width: 78ch; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
  .actions input[type=text] { flex: 1; min-width: 200px; max-width: 420px; width: auto; }
  .meta { font-size: 12.5px; color: var(--muted); margin: 8px 0 0; }
  .empty { padding: 36px 0; color: var(--muted); }
  .qitem.saving .actions { pointer-events: none; opacity: .6; }

  /* ---------- add query ---------- */
  .form { max-width: 800px; }
  .fgrid { display: grid; grid-template-columns: 180px 1fr; gap: 14px; margin-bottom: 16px; align-items: start; }
  .fgrid > label { font-weight: 500; padding-top: 8px; }
  .ok { color: var(--verified); margin-left: 12px; font-weight: 500; }

  /* Sections List */
  .sec-list { border: 1px solid var(--line); background: #fff; border-radius: 6px; padding: 20px; margin-top: 20px; }
  .sec-box { margin-bottom: 24px; border-bottom: 1px dashed var(--line); padding-bottom: 16px; }
  .sec-box:last-child { margin-bottom: 0; border-bottom: 0; padding-bottom: 0; }
  .sec-box label { display: block; font-weight: 600; color: var(--navy); margin-bottom: 8px; font-size: 15px; }
  .sec-box textarea { min-height: 64px; }

  /* ---------- report ---------- */
  .rtable { width: 100%; border-collapse: collapse; margin: 6px 0 28px; font-size: 14px; }
  .rtable th, .rtable td { text-align: left; vertical-align: top; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  .rtable th { font-weight: 600; color: var(--muted); background: #EDF0F4; }
  .rscroll { overflow-x: auto; }
  .rfixed { table-layout: fixed; }
  .rfixed td, .rfixed th { overflow-wrap: anywhere; }
  .rhead { display: flex; gap: 14px; align-items: baseline; margin-top: 22px; }
  .rhead h3 { margin: 0; font-size: 17px; }

  /* ---------- toast ---------- */
  .toast {
    position: fixed; left: 20px; bottom: 20px; background: var(--ink); color: #fff;
    padding: 10px 16px; border-radius: 6px; max-width: min(520px, 90vw); z-index: 20;
  }
  .toast.bad { background: var(--returned); }

  @media (max-width: 760px) {
    .prow { grid-template-columns: 1fr; gap: 8px; }
    .fgrid { grid-template-columns: 1fr; gap: 6px; }
    .fgrid > label { padding-top: 0; }
    .who { text-align: left; }
    .qhead { flex-direction: column; gap: 6px; }
    .sec-list { padding: 12px; }
    .stats { grid-template-columns: repeat(2, 1fr); }
    .piewrap { justify-content: center; }
    .rkstats { grid-template-columns: 1fr; }
    .rk { grid-template-columns: 36px 1fr; gap: 8px 12px; }
    .rk .rkbar, .rk .rkv { grid-column: 1 / -1; }
  }
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

<script>
/* =====================================================================
 * STATE & HELPERS
 * ===================================================================== */
const S = {
  auth: null, user: null, sections: [], divisions: [], months: [], month: '',
  tab: '', dash: '', dashProv: '', dashMonths: [], rkView: 'division', rkProv: '', rkMonths: [], rview: 'detail', secMonths: [], data: [], editing: null,
  cache: {}, pending: {}, ver: 0,
  f: { province: '', division: '', section: '', stage: '', q: '' }
};

const STAGE = {
  awaiting_answer: { label: 'Pending Answer',  cls: 'waiting' },
  returned:        { label: 'Returned',        cls: 'returned' },
  awaiting_review: { label: 'Awaiting review', cls: 'review' },
  verified:        { label: 'Resolved Query',  cls: 'verified' }
};

// Auditor role removed. Admin has full rights.
const TABS = {
  Admin:    [['overview', 'Dashboard'], ['add', 'Add query'], ['queries', 'All queries'], ['ranking', 'Ranking'], ['report', 'Report']],
  CO:       [['overview', 'Dashboard'], ['add', 'Add query'], ['queries', 'All queries'], ['ranking', 'Ranking'], ['report', 'Report']],
  Senior:   [['overview', 'Dashboard'], ['queries', 'All queries'], ['ranking', 'Ranking'], ['report', 'Report']],
  Division: [['queries', 'My queries'], ['report', 'Report']],
  Viewer:   [['overview', 'Dashboard'], ['queries', 'All queries'], ['ranking', 'Ranking'], ['report', 'Report']]
};

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g,
  c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function api(fn, ...args) {
  return new Promise((resolve, reject) => {
    google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler(e => {
        const msg = String((e && e.message) || e).replace(/^Error:\s*/, '');
        if (S.user && /session expired|please sign in/i.test(msg)) {      // saved sign-in no longer valid
          clearAuth(); S.auth = null; S.user = null; S.data = []; S.cache = {}; S.pending = {};
          showLogin('Session expired. Please sign in again.');
        }
        reject(new Error(msg));
      })
      [fn](...args);
  });
}

let toastTimer;
function toast(msg, bad) {
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast' + (bad ? ' bad' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.add('hidden'), bad ? 6000 : 3200);
}

function monthLabel(m) {
  const [y, mo] = String(m).split('-').map(Number);
  if (!y || !mo) return m;
  return new Date(y, mo - 1, 1).toLocaleDateString('en-GB', { month: 'short', year: 'numeric' });
}

function provinceList() {
  const seen = {}, out = [];
  S.divisions.forEach(d => { if (d.province && !seen[d.province]) { seen[d.province] = 1; out.push(d.province); } });
  return out;
}
function divsOfProvince(p) { return p ? S.divisions.filter(d => d.province === p) : S.divisions; }
function repScope(div, prov) { return div ? div : (prov ? prov + ' (all divisions)' : ''); }
function provOf(div) { return (S.divisions.find(d => d.division === div) || {}).province || ''; }

async function run(btn, fn) {
  if (btn) btn.disabled = true;
  try { return await fn(); }
  catch (e) { toast(e.message, true); }
  finally { if (btn) btn.disabled = false; }
}

 * SIGN IN
 * ===================================================================== */
function showLogin(msg) {
  $('#app').innerHTML = `
    <form class="login" id="loginForm" autocomplete="off">
      <img class="logo" src="${LOGO}" alt="Dawat-e-Islami logo" onerror="this.style.display='none'">
      <h1>EMR Compliance</h1>
      <p><b class="org">Dawat-e-Islami Trust</b><br>Sign in with the User ID and password you were given.</p>
      <div class="row"><label for="uid">User ID</label><input id="uid" type="text" autocapitalize="none" required></div>
      <div class="row"><label for="pin">Password</label><input id="pin" type="password" required>
        <label style="display:flex;align-items:center;gap:8px;font-weight:400;margin:8px 0 0;font-size:14px;cursor:pointer"><input type="checkbox" id="showPin" style="width:auto"> Show password</label></div>
      <div class="err" id="loginErr" role="alert">${esc(msg || '')}</div>
      <button class="btn primary" type="submit">Sign in</button>
      <p class="devcredit">Developed by <b>Bluemoonways</b> &middot; <a href="mailto:info.bluemoonways@gmail.com">info.bluemoonways@gmail.com</a></p>
    </form>`;
  $('#uid').focus();
  $('#showPin').onchange = e => { $('#pin').type = e.target.checked ? 'text' : 'password'; };
  $('#loginForm').addEventListener('submit', async ev => {
    ev.preventDefault();
    const btn = ev.target.querySelector('button');
    const auth = { id: $('#uid').value.trim(), pin: $('#pin').value.trim() };
    btn.disabled = true;
    try {
      await startSession(auth);
    } catch (e) {
      $('#loginErr').textContent = e.message;
      btn.disabled = false;
    }
  });
}

/* The password is never stored. After sign-in the server returns a signed token (valid 7 days);
   only that token is kept in this browser. */
const AUTH_KEY = 'emr_session';
const AUTH_DAYS = 7;
function saveSession(token) {
  try { localStorage.setItem(AUTH_KEY, JSON.stringify({ token: token, exp: Date.now() + AUTH_DAYS * 24 * 60 * 60 * 1000 })); } catch (e) {}
}
function loadAuth() {
  try {
    localStorage.removeItem('emr_auth');                 // older version kept the password here, wipe it
    const d = JSON.parse(localStorage.getItem(AUTH_KEY) || 'null');
    if (!d || !d.token || !d.exp || d.exp < Date.now()) { clearAuth(); return null; }
    return { token: d.token };
  } catch (e) { return null; }
}
function clearAuth() { try { localStorage.removeItem(AUTH_KEY); localStorage.removeItem('emr_auth'); } catch (e) {} }

async function startSession(auth) {
  const r = await api('api_login', auth);
  S.auth = r.token ? { token: r.token } : auth;           // from now on only the token is used
  S.user = r.user; S.sections = r.sections; S.divisions = r.divisions;
  S.months = r.months; S.month = r.month;
  S.cache = {}; S.cache[r.month] = r.data || [];
  if (r.token) saveSession(r.token);                      // fresh sign-in: start a new 7 days
  renderShell();
  openTab(TABS[S.user.role][0][0]);
}

function signOut() {
  clearAuth();
  S.dash = ''; S.dashProv = ''; S.dashMonths = []; S.rkMonths = []; S.rkView = 'division'; S.rkProv = ''; S.secMonths = []; S.rview = 'detail'; S.auth = null; S.user = null; S.data = []; S.cache = {}; S.pending = {}; S.ver = 0;
  showLogin();
}

function monthSelectHtml() {
  return `<select id="mSel" aria-label="Month">${monthOptions()}</select>`;
}

function monthOptions() {
  return S.months.map(m => `<option value="${m}"${m === S.month ? ' selected' : ''}>${monthLabel(m)}</option>`).join('');
}

function stageOf(o) {
  if (o.status === 'Verified') return 'verified';
  if (!String(o.answer || '').trim()) return 'awaiting_answer';
  return String(o.remarks || '').trim() ? 'returned' : 'awaiting_review';
}

function nowStr() {
  try {
    const p = new Intl.DateTimeFormat('en-GB', {
      timeZone: 'Asia/Karachi', day: '2-digit', month: 'short', year: 'numeric',
      hour: '2-digit', minute: '2-digit', hourCycle: 'h23'
    }).formatToParts(new Date());
    const g = t => (p.find(x => x.type === t) || {}).value || '';
    return g('day') + ' ' + g('month') + ' ' + g('year') + ', ' + g('hour') + ':' + g('minute');
  } catch (e) { return new Date().toLocaleString(); }
}

/* The dashboard is worked out here from the list, so no extra server call is needed */
function computeOverview(list) {
  const blank = () => ({ total: 0, awaiting_answer: 0, returned: 0, awaiting_review: 0, verified: 0 });
  const by = {}, totals = blank();
  list.forEach(o => {
    const d = o.division;
    by[d] = by[d] || blank();
    by[d].total++; by[d][o.stage]++;
    totals.total++; totals[o.stage]++;
  });
  let divisions = S.divisions.map(d => Object.assign({ division: d.division, province: d.province }, by[d.division] || blank()));
  if (S.user.role === 'Division') divisions = divisions.filter(d => d.division === S.user.division);
  return { month: S.month, totals: totals, divisions: divisions };
}

function setData(list) { S.data = list; S.cache[S.month] = list; }

function renderTab() {
  if (S.tab === 'overview') renderOverview();
  else if (S.tab === 'ranking') renderRanking();
  else if (S.tab === 'report') renderReport();
  else renderQueries();
}

function typingInView() {
  const a = document.activeElement, v = $('#view');
  return !!(a && v && v.contains(a) && /^(TEXTAREA|INPUT|SELECT)$/.test(a.tagName));
}

/* Fetch fresh data in the background. The screen only changes if something really changed. */
function refreshData(tab, month) {
  const ver = S.ver;
  return api('api_list', S.auth, month).then(list => {
    const old = S.cache[month];
    if (old && JSON.stringify(old) === JSON.stringify(list)) return;
    if (S.ver !== ver) return;                                  // a save happened meanwhile, keep local state
    if (S.month !== month) { S.cache[month] = list; return; }
    if (S.tab !== tab || typingInView()) return;               // do not wipe what the person is typing
    setData(list);
    renderTab();
  }).catch(e => {
    if (!S.cache[month] && S.month === month && S.tab === tab) $('#view').innerHTML = `<p class="err">${esc(e.message)}</p>`;
  });
}

function go(tab, filter) {
  S.tab = tab; S.editing = null;
  if (tab === 'overview') S.dashMonths = [S.month];
  if (tab === 'report') S.secMonths = [S.month];
  if (tab === 'ranking') S.rkMonths = [S.month];
  S.f = Object.assign({ province: '', division: '', section: '', stage: '', q: '' }, filter || {});
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === tab)));
  if (tab === 'add') return renderAdd();
  if (tab === 'pin') return renderPin();
  const cached = S.cache[S.month];
  if (cached) { S.data = cached; renderTab(); }          // show what we already have instantly
  else { S.data = []; $('#view').innerHTML = '<p class="muted">Loading…</p>'; }
  return refreshData(tab, S.month);
}

function openTab(tab) { return go(tab); }

/* Open "All queries" with a preset filter (used by Dashboard cards and rows) */
function openQueriesWith(filter) { return go('queries', filter); }

/* =====================================================================
 * DASHBOARD
 * ===================================================================== */
/* "08 Oct 2026, 15:53" (Karachi time) -> Date */
function parseQDate(str) {
  const m = String(str || '').match(/(\d{1,2})\s+([A-Za-z]{3})[A-Za-z]*\s+(\d{4}),?\s*(\d{1,2}):(\d{2})/);
  if (!m) return null;
  const mon = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'].indexOf(m[2].toLowerCase());
  if (mon < 0) return null;
  return new Date(Date.UTC(+m[3], mon, +m[1], +m[4], +m[5]) - 5 * 3600 * 1000);   // Karachi = UTC+5
}

/* Age in days of the oldest query still waiting for an answer, and which division(s) it belongs to */
function agingDays(list) {
  let max = -1, divs = [];
  const now = Date.now();
  list.forEach(o => {
    if (o.stage !== 'awaiting_answer') return;
    const d = parseQDate(o.queryDate);
    if (!d) return;
    const days = Math.max(0, Math.floor((now - d.getTime()) / 86400000));
    if (days > max) { max = days; divs = [o.division]; }
    else if (days === max && divs.indexOf(o.division) < 0) divs.push(o.division);
  });
  return { days: max, divs: divs };
}

function dashMonthList() {
  const m = (S.dashMonths || []).filter(x => S.months.indexOf(x) >= 0);
  return (m.length ? m : [S.month]).slice().sort().reverse();
}

function agingCard(list, m, sel) {
  const a = agingDays(list), d = a.days, has = d >= 0;
  let who = '';
  if (has && !sel) {                       // only when "All divisions" is chosen
    who = a.divs.length <= 2 ? a.divs.join(', ') : a.divs.length + ' divisions';
  }
  return `<button class="stat aging${has ? '' : ' zero'}" data-act="filter-stage" data-stage="awaiting_answer" data-month="${m}">
      <div class="num">${has ? d + (d === 1 ? ' day' : ' days') : '0 days'}</div>
      <div class="lbl">Aging</div>${who ? `<div class="sub">${esc(who)}</div>` : ''}</button>`;
}

/* ---------- section-wise pie chart ---------- */
const PIE_COLORS = ['#1D3557','#2E7D4F','#C98A12','#B4432F','#6B4FA0','#2F6FEB','#0E9AA7','#E07A5F','#7A9E2E',
                    '#D1495B','#00798C','#EDAE49','#5C4B51','#3D5A80','#98C1D9','#A44A3F','#4F772D','#9A031E','#5F0F40','#8C99A8'];

function sectionPie(list, m) {
  if (!list.length) return '<p class="muted" style="margin:0">No queries to show.</p>';
  const cnt = {};
  list.forEach(o => { cnt[o.section] = (cnt[o.section] || 0) + 1; });
  const order = S.sections.slice();
  Object.keys(cnt).forEach(n => { if (order.indexOf(n) < 0) order.push(n); });

  // sections with more queries come first
  let items = order.filter(n => cnt[n]).map(n => ({ name: n, v: cnt[n] }));
  items.sort((a, b) => (b.v - a.v) || (order.indexOf(a.name) - order.indexOf(b.name)));

  const TOP = 10;
  let rest = [];
  if (items.length > TOP) { rest = items.slice(TOP); items = items.slice(0, TOP); }

  const total = list.length, RO = 96, RI = 54, C = 100, RM = (RO + RI) / 2;
  const light = { '#C98A12': 1, '#EDAE49': 1, '#98C1D9': 1, '#7A9E2E': 1 };
  const slices = items.map((it, i) => ({ name: it.name, v: it.v, color: PIE_COLORS[i % PIE_COLORS.length] }));
  if (rest.length) {
    slices.push({ name: 'Other (' + rest.length + ' sections)', v: rest.reduce((s, x) => s + x.v, 0), color: '#8C99A8', other: true });
  }

  const pt = (r, a) => (C + r * Math.cos(a)).toFixed(2) + ' ' + (C + r * Math.sin(a)).toFixed(2);
  const pct = v => Math.round(v / total * 100) + '%';
  let a0 = -Math.PI / 2, svg = '', lbl = '';

  slices.forEach(s => {
    const frac = s.v / total;
    const tip = esc(s.name) + ': ' + s.v + ' (' + pct(s.v) + ')';
    let am;
    if (frac >= 0.9999) {
      svg += `<circle cx="${C}" cy="${C}" r="${RM}" fill="none" stroke="${s.color}" stroke-width="${RO - RI}"><title>${tip}</title></circle>`;
      am = -Math.PI / 2;
    } else {
      const a1 = a0 + frac * 2 * Math.PI, big = frac > 0.5 ? 1 : 0;
      svg += `<path d="M${pt(RO, a0)} A${RO} ${RO} 0 ${big} 1 ${pt(RO, a1)} L${pt(RI, a1)} A${RI} ${RI} 0 ${big} 0 ${pt(RI, a0)} Z" fill="${s.color}" stroke="#fff" stroke-width="1.5"><title>${tip}</title></path>`;
      am = (a0 + a1) / 2;
      a0 = a1;
    }
    if (frac >= 0.035) {
      const x = C + RM * Math.cos(am), y = C + RM * Math.sin(am);
      lbl += `<text x="${x.toFixed(2)}" y="${y.toFixed(2)}" fill="${light[s.color] ? '#14202E' : '#fff'}" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" pointer-events="none">${s.v}</text>`;
    }
  });

  const center = `<text x="${C}" y="${C - 6}" text-anchor="middle" font-size="26" font-weight="600" fill="#14202E">${total}</text>
    <text x="${C}" y="${C + 14}" text-anchor="middle" font-size="11" fill="#5B6A7A">queries</text>`;

  // ---------- table ----------
  const secRow = (name, v, color, extra) =>
    `<tr data-act="filter-section" data-section="${esc(name)}" data-month="${m}"${extra || ''}>
       <td>${color ? `<i style="background:${color}"></i>` : ''}${esc(name)}</td>
       <td class="num">${v}</td><td class="num">${pct(v)}</td></tr>`;

  let rows = '';
  slices.forEach(s => {
    if (!s.other) { rows += secRow(s.name, s.v, s.color); return; }
    rows += `<tr data-act="toggle-other" title="Click to show / hide the other sections">
        <td><i style="background:${s.color}"></i>${esc(s.name)}<span class="arrow">&#9660;</span></td>
        <td class="num">${s.v}</td><td class="num">${pct(s.v)}</td></tr>`;
    rest.forEach(r => {
      rows += `<tr class="othsub hidden" data-act="filter-section" data-section="${esc(r.name)}" data-month="${m}">
        <td>${esc(r.name)}</td><td class="num">${r.v}</td><td class="num">${pct(r.v)}</td></tr>`;
    });
  });
  rows += `<tr class="tot"><td>Total</td><td class="num">${total}</td><td class="num">100%</td></tr>`;

  return `<div class="piewrap">
    <svg viewBox="0 0 200 200" role="img" aria-label="Section-wise queries">${svg}${lbl}${center}</svg>
    <table class="pietable">
      <thead><tr><th>Section</th><th class="num">Queries</th><th class="num">%</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`;
}

/* ---------- province-wise / division-wise stacked columns ---------- */
function columnChart(list, m, sel, prov) {
  if (sel) return '';                                    // one division chosen: nothing to compare
  const byProv = !prov;
  const keys = byProv ? provinceList() : divsOfProvince(prov).map(d => d.division);
  const g = {};
  keys.forEach(k => { g[k] = { total: 0, awaiting_answer: 0, returned: 0, awaiting_review: 0, verified: 0 }; });
  list.forEach(o => {
    const k = byProv ? provOf(o.division) : o.division;
    if (!g[k]) return;
    g[k].total++; g[k][o.stage]++;
  });
  if (!keys.length) return '';
  const W = 760, H = 340, L = 38, R = 10, T = 26, B = 72;
  const max = Math.max(1, ...keys.map(k => g[k].total));
  const step = max <= 10 ? 2 : max <= 25 ? 5 : max <= 60 ? 10 : max <= 120 ? 20 : 50;
  const top = Math.ceil(max / step) * step;
  const y = v => T + (H - T - B) * (1 - v / top);
  const bw = (W - L - R) / keys.length;
  const SEG = [['verified', '#2E7D4F'], ['awaiting_review', '#C98A12'], ['returned', '#B4432F'], ['awaiting_answer', '#8C99A8']];
  let svg = '';
  for (let v = 0; v <= top; v += step) {
    svg += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="#DCE1E8"/>
      <text x="${L - 6}" y="${y(v) + 4}" font-size="11" text-anchor="end" fill="#5B6A7A">${v}</text>`;
  }
  keys.forEach((k, i) => {
    const r = g[k], x = L + i * bw + bw * 0.15, w = bw * 0.7, cx = x + w / 2;
    const tip = esc(k) + ': ' + r.total + ' total, ' + r.verified + ' resolved, ' + r.awaiting_review + ' in review, ' +
                r.returned + ' returned, ' + r.awaiting_answer + ' pending';
    let acc = 0, bars = '';
    const STATUS_LABELS = {
      'verified': ['Resolved', 'Query'],
      'awaiting_review': ['Awaiting', 'review'],
      'returned': ['Returned'],
      'awaiting_answer': ['Pending', 'Answer']
    };

    SEG.forEach(([st, col]) => {
      const v = r[st];
      if (!v) return;
      const y1 = y(acc + v), y0 = y(acc);
      const h = y0 - y1;

      bars += `<rect x="${x.toFixed(1)}" y="${y1.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" fill="${col}"/>`;

      // only when the segment is at least 35px tall, show number and label lines
      if (h >= 35) {
        const lines = STATUS_LABELS[st];
        bars += `<text x="${cx.toFixed(1)}" y="${((y0 + y1) / 2 - 8).toFixed(1)}" fill="#fff" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central" pointer-events="none">${v}</text>`;

        if (lines.length === 2) {
          bars += `<text x="${cx.toFixed(1)}" y="${((y0 + y1) / 2 + 3).toFixed(1)}" fill="#fff" font-size="7.5" font-weight="400" text-anchor="middle" dominant-baseline="central" pointer-events="none">${lines[0]}</text>`;
          bars += `<text x="${cx.toFixed(1)}" y="${((y0 + y1) / 2 + 12).toFixed(1)}" fill="#fff" font-size="7.5" font-weight="400" text-anchor="middle" dominant-baseline="central" pointer-events="none">${lines[1]}</text>`;
        } else {
          bars += `<text x="${cx.toFixed(1)}" y="${((y0 + y1) / 2 + 6).toFixed(1)}" fill="#fff" font-size="7.5" font-weight="400" text-anchor="middle" dominant-baseline="central" pointer-events="none">${lines[0]}</text>`;
        }
      } else {
        // little room: number only
        bars += `<text x="${cx.toFixed(1)}" y="${((y0 + y1) / 2).toFixed(1)}" fill="#fff" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central" pointer-events="none">${v}</text>`;
      }

      acc += v;
    });
    svg += `<g data-act="open-group" data-month="${m}" data-prov="${esc(byProv ? k : prov)}" data-div="${byProv ? '' : esc(k)}" style="cursor:pointer">
      <title>${tip}</title>
      <rect x="${(L + i * bw).toFixed(1)}" y="${T}" width="${bw.toFixed(1)}" height="${H - T - B}" fill="transparent"/>
      ${bars}
      <text x="${cx.toFixed(1)}" y="${(y(r.total) - 6).toFixed(1)}" font-size="12" font-weight="600" text-anchor="middle" fill="#14202E" pointer-events="none">${r.total}</text>
      <text x="${(cx + 4).toFixed(1)}" y="${H - B + 16}" font-size="11.5" text-anchor="end" fill="#5B6A7A" transform="rotate(-30 ${(cx + 4).toFixed(1)} ${H - B + 16})" pointer-events="none">${esc(k)}</text>
    </g>`;
  });
  return `<div class="piebox gchart">
    <h4>${byProv ? 'Province-wise' : 'Division-wise (' + esc(prov) + ')'} queries</h4>
    <div class="legend">
      <span><i class="c-verified"></i>Resolved Query</span>
      <span><i class="c-review"></i>Awaiting review</span>
      <span><i class="c-returned"></i>Returned</span>
      <span><i class="c-awaiting"></i>Pending Answer</span>
    </div>
    <svg class="colchart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Stacked columns of query status">${svg}</svg>
  </div>`;
}

function monthBlock(m, sel, prov) {
  const data = S.cache[m];
  if (!data) return `<section class="mblock"><p class="stats-title">${esc(monthLabel(m))}: <span class="muted">Loading…</span></p></section>`;
  const names = divsOfProvince(prov).map(d => d.division);
  const list = sel ? data.filter(o => o.division === sel)
             : prov ? data.filter(o => names.indexOf(o.division) >= 0)
             : data;
  const scope = sel ? esc(sel) + ' (' + esc(provOf(sel)) + ')'
              : prov ? esc(prov) + ' (all divisions)'
              : 'Pakistan (all provinces)';
  const t = computeOverview(list).totals;
  const card = (cls, n, label, stage) =>
    `<button class="stat ${cls}${n ? '' : ' zero'}" data-act="filter-stage" data-stage="${stage}" data-month="${m}">
       <div class="num">${n}</div><div class="lbl">${label}</div></button>`;
  return `
    <section class="mblock">
      <p class="stats-title">${esc(monthLabel(m))} summary: <b>${scope}</b></p>
      <div class="stats">
        ${card('total',    t.total,           'Total queries',   '')}
        ${card('verified', t.verified,        'Resolved Query',  'verified')}
        ${card('review',   t.awaiting_review, 'Awaiting review', 'awaiting_review')}
        ${card('returned', t.returned,        'Returned',        'returned')}
        ${card('awaiting', t.awaiting_answer, 'Pending Answer',  'awaiting_answer')}
        ${agingCard(list, m, sel)}
      </div>
      <div class="piebox">
        <h4>Section-wise queries (${t.total})</h4>
        ${sectionPie(list, m)}
      </div>
      ${columnChart(list, m, sel, prov)}
    </section>`;
}

function dashSummaryText() {
  const m = dashMonthList();
  if (m.length === 1) return monthLabel(m[0]);
  if (m.length === S.months.length) return 'All months (' + m.length + ')';
  if (m.length === 2) return m.map(monthLabel).join(', ');
  return m.length + ' months selected';
}

function renderOverview() {
  const sel = S.dash || '';
  const months = dashMonthList();
  const checks = S.months.slice().sort().reverse().map(m =>
    `<label><input type="checkbox" class="dm" value="${m}"${months.indexOf(m) >= 0 ? ' checked' : ''}>${esc(monthLabel(m))}</label>`).join('');

  $('#view').innerHTML = `
    <div class="filters" style="margin-top:0">
      <select id="dProv" aria-label="Province" style="max-width:220px">
        <option value="">All provinces</option>
        ${provinceList().map(p => `<option value="${esc(p)}"${p === S.dashProv ? ' selected' : ''}>${esc(p)}</option>`).join('')}
      </select>
      <select id="dDiv" aria-label="Division" style="max-width:300px">
        <option value="">${S.dashProv ? 'All divisions in ' + esc(S.dashProv) : 'All divisions'}</option>
        ${divsOfProvince(S.dashProv).map(d => `<option value="${esc(d.division)}"${d.division === sel ? ' selected' : ''}>${esc(d.division)}</option>`).join('')}
      </select>
      <details class="msel" id="dMsel">
        <summary id="dMsum" aria-label="Months">${esc(dashSummaryText())}</summary>
        <div class="mpanel">
          ${checks}
          <div class="mact">
            <button type="button" class="btn plain" data-act="dash-all">Select all</button>
            <button type="button" class="btn plain" data-act="dash-one">Latest only</button>
          </div>
        </div>
      </details>
    </div>
    <div id="dblocks"></div>`;
  paintDash();
}

function paintDash() {
  const box = $('#dblocks');
  if (!box || S.tab !== 'overview') return;
  const sel = S.dash || '';
  const prov = S.dashProv || '';
  const months = dashMonthList();

  const missing = months.filter(m => !S.cache[m]);
  if (missing.length && !S.dashLoading) {
    S.dashLoading = true;
    Promise.all(missing.map(m => api('api_list', S.auth, m).then(l => { if (!S.cache[m]) S.cache[m] = l; })))
      .catch(e => { toast(e.message, true); S.dashMonths = [S.month]; syncDash(); })
      .then(() => { S.dashLoading = false; paintDash(); });
  }
  box.innerHTML = months.map(m => monthBlock(m, sel, prov)).join('');
}

function syncDash() {
  const months = dashMonthList();
  document.querySelectorAll('.dm').forEach(x => { x.checked = months.indexOf(x.value) >= 0; });
  const sm = $('#dMsum'); if (sm) sm.textContent = dashSummaryText();
  paintDash();
}

/* =====================================================================
 * RANKING (resolved queries: divisions / provinces)
 * ===================================================================== */
function rkMonthList() {
  const m = (S.rkMonths || []).filter(x => S.months.indexOf(x) >= 0);
  return (m.length ? m : [S.month]).slice().sort().reverse();
}

function rkSummaryText() {
  const m = rkMonthList();
  if (m.length === 1) return monthLabel(m[0]);
  if (m.length === S.months.length) return 'All months (' + m.length + ')';
  if (m.length === 2) return m.map(monthLabel).join(', ');
  return m.length + ' months selected';
}

/* true when every selected month is in memory; otherwise starts loading and repaints when done */
function rkEnsure() {
  const missing = rkMonthList().filter(m => !S.cache[m]);
  if (!missing.length) return true;
  if (!S.rkLoading) {
    S.rkLoading = true;
    Promise.all(missing.map(m => api('api_list', S.auth, m).then(l => { if (!S.cache[m]) S.cache[m] = l; })))
      .catch(e => { toast(e.message, true); S.rkMonths = [S.month]; })
      .then(() => { S.rkLoading = false; if (S.tab === 'ranking') syncRank(); });
  }
  return false;
}

function renderRanking() {
  const months = rkMonthList(), isProv = S.rkView === 'province';
  const checks = S.months.slice().sort().reverse().map(m =>
    `<label><input type="checkbox" class="km" value="${m}"${months.indexOf(m) >= 0 ? ' checked' : ''}>${esc(monthLabel(m))}</label>`).join('');
  const provSel = isProv ? '' : `
    <select id="kProv" aria-label="Province" style="max-width:220px"><option value="">All provinces</option>
      ${provinceList().map(p => `<option value="${esc(p)}"${p === S.rkProv ? ' selected' : ''}>${esc(p)}</option>`).join('')}
    </select>`;
  $('#view').innerHTML = `
    <h2>Ranking</h2>
    <p class="lede">Divisions and provinces ranked by how much of their work is resolved. Click a row to open its queries.</p>
    <div class="seg" role="group" aria-label="Ranking type">
      <button type="button" class="${!isProv ? 'on' : ''}" data-act="rk-view" data-v="division">Divisions</button>
      <button type="button" class="${isProv ? 'on' : ''}" data-act="rk-view" data-v="province">Provinces</button>
    </div>
    <div class="filters" style="margin-top:6px">
      ${provSel}
      <details class="msel" id="kMsel">
        <summary id="kMsum" aria-label="Months">${esc(rkSummaryText())}</summary>
        <div class="mpanel">
          ${checks}
          <div class="mact">
            <button type="button" class="btn plain" data-act="rk-all">Select all</button>
            <button type="button" class="btn plain" data-act="rk-one">Latest only</button>
          </div>
        </div>
      </details>
    </div>
    <div id="rkout"></div>`;
  paintRank();
}

function rankData() {
  const months = rkMonthList(), isProv = S.rkView === 'province', pk = isProv ? '' : (S.rkProv || '');
  const all = [].concat.apply([], months.map(m => S.cache[m] || []));
  const blank = () => ({ total: 0, verified: 0, awaiting_review: 0, returned: 0, awaiting_answer: 0 });
  const items = isProv
    ? provinceList().map(p => { const n = divsOfProvince(p).length; return { name: p, prov: p, sub: n + (n === 1 ? ' division' : ' divisions'), st: blank() }; })
    : divsOfProvince(pk).map(d => ({ name: d.division, prov: d.province, sub: d.province, st: blank() }));
  const idx = {};
  items.forEach(it => { idx[it.name] = it; });
  const tot = blank();
  all.forEach(o => {
    const it = idx[isProv ? provOf(o.division) : o.division];
    if (!it) return;
    it.st.total++; it.st[o.stage]++; tot.total++; tot[o.stage]++;
  });
  items.forEach(it => { it.pct = it.st.total ? it.st.verified / it.st.total : 0; });
  const ranked = items.filter(it => it.st.total).sort((a, b) =>
    (b.pct - a.pct) || (b.st.verified - a.st.verified) || (b.st.total - a.st.total) || a.name.localeCompare(b.name));
  let prev = null, rank = 0;
  ranked.forEach((it, i) => { if (prev === null || it.pct !== prev) { rank = i + 1; prev = it.pct; } it.rank = rank; });
  return { isProv: isProv, pk: pk, tot: tot, ranked: ranked, empty: items.filter(it => !it.st.total) };
}

function rankHtml(D) {
  const scope = D.isProv ? 'Pakistan (by province)' : (D.pk ? D.pk + ' (by division)' : 'Pakistan (by division)');
  const t = D.tot, overall = t.total ? Math.round(t.verified / t.total * 100) + '%' : '—';
  const names = arr => arr.length <= 2 ? arr.map(x => x.name).join(', ') : arr.length + ' tied';
  const best = D.ranked.length ? D.ranked[0].pct : 0;
  const topGroup = best > 0 ? D.ranked.filter(it => it.pct === best) : [];
  const low = D.ranked.length ? D.ranked[D.ranked.length - 1].pct : 0;
  const lowGroup = D.ranked.length && low < best ? D.ranked.filter(it => it.pct === low) : [];

  const cards = `
    <div class="rkstats">
      <div class="stat total"><div class="num">${overall}</div><div class="lbl">Resolved: ${esc(scope)}</div>
        <div class="sub">${t.verified} of ${t.total} queries</div></div>
      <div class="stat verified"><div class="num sm">${topGroup.length ? esc(names(topGroup)) : '—'}</div><div class="lbl">Best performing</div>
        <div class="sub">${topGroup.length ? Math.round(best * 100) + '% resolved' : 'No resolved queries yet'}</div></div>
      <div class="stat returned"><div class="num sm">${lowGroup.length ? esc(names(lowGroup)) : '—'}</div><div class="lbl">Needs attention</div>
        <div class="sub">${lowGroup.length ? Math.round(low * 100) + '% resolved' : 'Nothing to compare yet'}</div></div>
    </div>`;

  const row = it => {
    const p = Math.round(it.pct * 100), top = it.rank <= 3 && it.pct > 0;
    return `<button type="button" class="rk" data-act="open-group" data-prov="${esc(it.prov)}" data-div="${D.isProv ? '' : esc(it.name)}">
      <span class="rkn r${top ? it.rank : 0}">${it.rank}</span>
      <div class="pname"><b>${esc(it.name)}</b><span>${esc(it.sub)}</span></div>
      <div class="rkbar" role="img" aria-label="${esc(it.name)} ${p}% resolved"><span style="width:${p}%"></span></div>
      <div class="rkv"><b>${p}%</b><span>${it.st.verified} of ${it.st.total} resolved</span>
        <span class="rks">${it.st.awaiting_review} in review &middot; ${it.st.returned} returned &middot; ${it.st.awaiting_answer} pending</span></div>
    </button>`;
  };
  const none = it => `<div class="rk dim"><span class="rkn r0">&ndash;</span>
      <div class="pname"><b>${esc(it.name)}</b><span>${esc(it.sub)}</span></div>
      <div class="rkbar"></div><div class="rkv"><span>No queries</span></div></div>`;

  if (!D.ranked.length) return cards + '<div class="empty">No queries for the selected month(s) yet.</div>';
  return cards +
    `<h3 class="sech" style="margin-top:6px">${D.isProv ? 'Province' : 'Division'} ranking, best first</h3>` +
    D.ranked.map(row).join('') + D.empty.map(none).join('') +
    `<p class="meta">Ranked by resolved % (Resolved Query divided by total queries). Equal percentages share the same rank, and the one with more resolved queries is listed first.</p>`;
}

function paintRank() {
  const box = $('#rkout');
  if (!box || S.tab !== 'ranking') return;
  if (!rkEnsure()) { box.innerHTML = '<p class="muted">Loading…</p>'; return; }
  box.innerHTML = rankHtml(rankData());
}

function syncRank() {
  const months = rkMonthList();
  document.querySelectorAll('.km').forEach(x => { x.checked = months.indexOf(x.value) >= 0; });
  const sm = $('#kMsum'); if (sm) sm.textContent = rkSummaryText();
  paintRank();
}

/* =====================================================================
 * QUERIES LIST (all roles)
 * ===================================================================== */
function renderQueries() {
  const role = S.user.role;
  const t = computeOverview(S.data).totals;
  const title = role === 'Division' ? 'Your queries' : 'All queries';
  const divSel = role === 'Division' ? '' : `
    <select id="fProv" aria-label="Province"><option value="">All provinces</option>
      ${provinceList().map(p => `<option${p === S.f.province ? ' selected' : ''}>${esc(p)}</option>`).join('')}
    </select>
    <select id="fDiv" aria-label="Division"><option value="">All divisions</option>
      ${divsOfProvince(S.f.province).map(d => `<option${d.division === S.f.division ? ' selected' : ''}>${esc(d.division)}</option>`).join('')}
    </select>`;
  $('#view').innerHTML = `
    <h2>${title}</h2>
    <p class="muted" id="sumline" style="margin:0 0 6px">${summaryLine(t)}</p>
    <div class="filters">
      ${monthSelectHtml()}
      ${divSel}
      <select id="fSec" aria-label="Section"><option value="">All sections</option>
        ${S.sections.map(s => `<option${s === S.f.section ? ' selected' : ''}>${esc(s)}</option>`).join('')}
      </select>
      <select id="fStage" aria-label="Status">
        <option value="">Any status</option>
        ${Object.keys(STAGE).map(k => `<option value="${k}"${k === S.f.stage ? ' selected' : ''}>${STAGE[k].label}</option>`).join('')}
      </select>
      <input id="fQ" type="search" placeholder="Search text" aria-label="Search" value="${esc(S.f.q)}">
    </div>

    <div id="list"></div>`;

}

function summaryLine(t) {
  return `${t.total} total &middot; ${t.verified} resolved &middot; ${t.awaiting_answer + t.returned} to answer`;
}

function updateSummary() {
  const el = $('#sumline');
  if (el) el.innerHTML = summaryLine(computeOverview(S.data).totals);
}

function filtered() {
  const f = S.f, q = f.q.trim().toLowerCase();
  const rank = { returned: 0, awaiting_answer: 1, awaiting_review: 2, verified: 3 };
  const list = S.data.filter(o =>
    (!f.province || provOf(o.division) === f.province) &&
    (!f.division || o.division === f.division) &&
    (!f.section || o.section === f.section) &&
    (!f.stage || o.stage === f.stage) &&
    (!q || (o.query + ' ' + o.answer + ' ' + o.division).toLowerCase().includes(q)));
  if (S.user.role === 'Division') list.sort((a, b) => rank[a.stage] - rank[b.stage]);
  return list;
}

function paintList() {
  const list = filtered();
  $('#count').textContent = list.length + (list.length === 1 ? ' query' : ' queries');
  $('#list').innerHTML = list.length
    ? list.map(qItem).join('')
    : `<div class="empty">${S.data.length ? 'No queries match these filters.' : 'There are no queries for ' + esc(monthLabel(S.month)) + ' yet.'}</div>`;
}

function qItem(o) {
  const role = S.user.role, st = STAGE[o.stage], editing = S.editing === o.id;
  const who = role === 'Division'
    ? `<span class="qwho">${esc(o.section)}</span>`
    : `<span class="qwho"><b>${esc(o.division)}</b>${esc(o.section)}</span>`;

  // QUERY BLOCK WITH EXPLICIT "QUERY:" LABEL
  const text = editing
    ? `<span class="field-label" style="color:var(--navy);">Edit Query:</span>
       <textarea id="eq-${o.id}" dir="auto">${esc(o.query)}</textarea>
       <div class="actions">
         <button class="btn primary" data-act="save-edit" data-id="${o.id}">Save query</button>
         <button class="btn" data-act="cancel-edit">Cancel</button>
       </div>`
    : `<span class="field-label label-query">Query:</span>
       <p class="qtext" dir="auto">${esc(o.query)}</p>`;

  // CLEAN ANSWER BLOCKS WITH LABELS BUT NO AWKWARD BACKGROUND CARDS
  let answerBlock = '';
  if (o.answer) {
    let labelText = 'Answer:';
    let labelClass = 'query';

    if (o.stage === 'verified') {
      labelText = '✔ Resolved Answer:';
      labelClass = 'verified';
    } else if (o.stage === 'returned') {
      labelText = '⚠ Returned Answer (Needs Correction):';
      labelClass = 'returned';
    } else if (o.stage === 'awaiting_review') {
      labelText = 'Answer (Pending Review):';
      labelClass = 'pending';
    }

    answerBlock = `
      <span class="field-label label-${labelClass}">${labelText}</span>
      <div class="answer-text" dir="auto">${esc(o.answer)}</div>`;
  } else {
    answerBlock = `
      <span class="field-label label-query">Answer:</span>
      <p class="meta" style="margin:0 0 12px 0">No answer yet.</p>`;
  }

  /* ---------- role based body ----------
     Admin   : everything (answer box always, Mark Resolved / Return, Edit / Delete always)
     Division: answer box until resolved
     Senior  : Mark Resolved / Return
     CO      : Edit / Delete before an answer exists
     Viewer  : read only                                                          */
  const isAdmin   = role === 'Admin';
  const canAnswer = isAdmin || role === 'Division';
  const canReview = isAdmin || role === 'Senior';
  const canManage = isAdmin || role === 'CO';

  let body = '';

  // Senior's note / returned reason
  if (o.remarks) {
    body += `<div class="note" dir="auto"><b>${role === 'Division' ? "Senior's note:" : 'Returned:'}</b> ${esc(o.remarks)}</div>`;
  }

  // Answer box: Division (until resolved), Admin (always)
  if (canAnswer && (isAdmin || o.stage !== 'verified')) {
    body += `<span class="field-label" style="color:var(--navy);">${isAdmin ? 'Answer (Admin can edit):' : 'Write Your Answer:'}</span>
      <textarea id="ans-${o.id}" dir="auto" placeholder="Type your compliance answer here...">${esc(o.answer)}</textarea>
      <div class="actions"><button class="btn primary" data-act="save-answer" data-id="${o.id}">
        ${o.stage === 'returned' ? 'Resubmit answer' : 'Save answer'}</button></div>`;
  } else {
    body += answerBlock;
  }

  // Mark Resolved / Return: Senior and Admin
  if (canReview && o.answer) {
    body += `<div class="actions">
      ${o.stage === 'verified' ? '' : `<button class="btn good" data-act="verify" data-id="${o.id}">Mark Resolved</button>`}
      <input type="text" id="rem-${o.id}" placeholder="Reason (needed to return)" dir="auto" aria-label="Reason for returning">
      <button class="btn danger" data-act="return" data-id="${o.id}">Return to division</button>
    </div>`;
  }

  // Edit / Delete: Admin always, CO only before an answer
  if (canManage && !editing && (isAdmin || !o.answer)) {
    body += `<div class="actions">
      <button class="btn" data-act="edit" data-id="${o.id}">Edit</button>
      <button class="btn danger" data-act="delete" data-id="${o.id}">Delete</button>
    </div>`;
  }

  const meta = [
    'Added ' + o.queryDate + (o.addedBy ? ' by ' + o.addedBy : ''),
    o.answeredBy ? 'Answered by ' + o.answeredBy + ', ' + o.answeredOn : '',
    o.verifiedBy ? 'Resolved by ' + o.verifiedBy + ', ' + o.verifiedOn : ''
  ].filter(Boolean).join('. ') + '.';

  return `
    <article class="qitem${S.pending[o.id] ? ' saving' : ''}" id="q-${o.id}">
      <div class="qhead">${who}<span class="chip ${st.cls}">${st.label}</span></div>
      ${text}
      ${body}
      <p class="meta">${esc(meta)}</p>
    </article>`;
}

function repaintItem(o) {
  if (!o) return;
  const el = document.getElementById('q-' + o.id);
  if (el) el.outerHTML = qItem(o);
}

/* Change the screen at once, save in the background, undo if the server says no */
async function mutate(id, apply, call, okMsg) {
  const month = S.month, list = S.cache[month] || S.data;
  const i = list.findIndex(x => x.id === id);
  if (i < 0 || S.pending[id]) return;
  const prev = list[i];
  S.ver++; S.pending[id] = true; S.editing = null;
  list[i] = apply(Object.assign({}, prev));
  repaintItem(list[i]); updateSummary();
  try {
    const o = await call();
    const j = list.findIndex(x => x.id === id);
    if (j >= 0) list[j] = o;
    delete S.pending[id];
    repaintItem(o); updateSummary();
    if (okMsg) toast(typeof okMsg === 'function' ? okMsg(o) : okMsg);
  } catch (e) {
    const j = list.findIndex(x => x.id === id);
    if (j >= 0) list[j] = prev;
    delete S.pending[id];
    repaintItem(prev); updateSummary();
    toast(e.message, true);
    // answer changed meanwhile: load the newest data so the reviewer sees it
    if (/refresh/i.test(e.message)) setTimeout(() => refreshData(S.tab, month), 0);
  } finally { S.ver++; }
}

async function removeQuery(id) {
  const month = S.month, list = S.cache[month] || S.data;
  const i = list.findIndex(x => x.id === id);
  if (i < 0 || S.pending[id]) return;
  const prev = list[i];
  S.ver++; S.pending[id] = true;
  list.splice(i, 1);
  const el = document.getElementById('q-' + id); if (el) el.remove();
  paintCountOnly(); updateSummary(); toast('Query deleted.');
  try {
    await api('api_deleteQuery', S.auth, id);
  } catch (e) {
    list.splice(Math.min(i, list.length), 0, prev);            // put it back
    if (S.month === month && S.tab === 'queries') paintList();
    updateSummary();
    toast(e.message, true);
  } finally { delete S.pending[id]; S.ver++; }
}

/* =====================================================================
 * EVENTS
 * ===================================================================== */
function onViewInput(e) {
  const id = e.target.id;
  if (id === 'fDiv') S.f.division = e.target.value;
  else if (id === 'fSec') S.f.section = e.target.value;
  else if (id === 'fStage') S.f.stage = e.target.value;
  else if (id === 'fQ') S.f.q = e.target.value;
  else if (id === 'rProv') { S.f.province = e.target.value; S.f.division = ''; return renderReport(); }
  else if (id === 'rDiv') { S.f.division = e.target.value; return renderReport(); }
  else if (id === 'dProv') { S.dashProv = e.target.value; S.dash = ''; return renderOverview(); }
  else if (id === 'fProv') { S.f.province = e.target.value; S.f.division = ''; return renderQueries(); }
  else if (id === 'dDiv') { S.dash = e.target.value; return paintDash(); }
  else if (id === 'mSel') { S.month = e.target.value; return go(S.tab, S.f); }
  else if (e.target.classList && e.target.classList.contains('dm')) {
    const picked = Array.from(document.querySelectorAll('.dm:checked')).map(x => x.value);
    if (!picked.length) { e.target.checked = true; picked.push(e.target.value); }
    S.dashMonths = picked;
    return syncDash();
  }
  else if (e.target.classList && e.target.classList.contains('sm')) {
    const picked = Array.from(document.querySelectorAll('.sm:checked')).map(x => x.value);
    if (!picked.length) { e.target.checked = true; picked.push(e.target.value); }
    S.secMonths = picked;
    return syncSec();
  }
  else if (id === 'kProv') { S.rkProv = e.target.value; return paintRank(); }
  else if (e.target.classList && e.target.classList.contains('km')) {
    const picked = Array.from(document.querySelectorAll('.km:checked')).map(x => x.value);
    if (!picked.length) { e.target.checked = true; picked.push(e.target.value); }
    S.rkMonths = picked;
    return syncRank();
  }
  else return;
  paintList();
}

function onViewClick(e) {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const act = b.dataset.act, id = b.dataset.id;

  if (act === 'toggle-other') {
    const open = b.classList.toggle('open');
    b.closest('table').querySelectorAll('tr.othsub').forEach(r => r.classList.toggle('hidden', !open));
    return;
  }

  if (act === 'open-division') return openQueriesWith({ division: b.dataset.div });
  if (act === 'dash-all') { S.dashMonths = S.months.slice(); return syncDash(); }
  if (act === 'dash-one') { S.dashMonths = [S.months.slice().sort().reverse()[0]]; return syncDash(); }
  if (act === 'filter-stage') {
    const m = b.dataset.month;
    if (m && m !== S.month) S.month = m;
    return openQueriesWith({ stage: b.dataset.stage, province: S.dashProv || '', division: S.dash || '' });
  }
  if (act === 'open-group') {
    const m = b.dataset.month;
    if (m && m !== S.month) S.month = m;
    return openQueriesWith({ province: b.dataset.prov || '', division: b.dataset.div || '' });
  }
  if (act === 'filter-section') {
    const m = b.dataset.month;
    if (m && m !== S.month) S.month = m;
    return openQueriesWith({ section: b.dataset.section, province: S.dashProv || '', division: S.dash || '' });
  }

  if (act === 'edit') { S.editing = id; return repaintItem(S.data.find(x => x.id === id)); }
  if (act === 'cancel-edit') { const o = S.data.find(x => x.id === S.editing); S.editing = null; return repaintItem(o); }

  if (act === 'save-edit') {
    const text = $('#eq-' + id).value.trim();
    if (!text) return toast('Query cannot be empty.', true);
    if (text.length > 2000) return toast('Query is too long (max 2000 characters).', true);
    return mutate(id, o => Object.assign(o, { query: text }),
      () => api('api_editQuery', S.auth, id, text), 'Query updated.');
  }
  if (act === 'delete') {
    if (b.dataset.sure !== '1') {
      b.dataset.sure = '1'; b.textContent = 'Confirm delete';
      return void setTimeout(() => { b.dataset.sure = ''; b.textContent = 'Delete'; }, 4000);
    }
    return removeQuery(id);
  }
  if (act === 'save-answer') {
    const ans = $('#ans-' + id).value.trim();
    const cur = (S.cache[S.month] || S.data).find(x => x.id === id);
    if (!ans && cur && !cur.answer) return toast('Pehle answer likhein.', true);
    if (!ans && cur && cur.answer &&
        !confirm('Answer box khali hai. Save karne se purana answer hat jayega aur query dobara "Pending Answer" ho jayegi. Continue?')) return;
    if (ans.length > 5000) return toast('Answer is too long (max 5000 characters).', true);
    return mutate(id, o => {
      o.answer = ans; o.status = 'Unverified';
      o.answeredBy = ans ? S.user.name : ''; o.answeredOn = ans ? nowStr() : '';
      o.verifiedBy = ''; o.verifiedOn = ''; o.remarks = '';
      o.stage = stageOf(o); return o;
    }, () => api('api_saveAnswer', S.auth, id, ans),
    o => o.answer ? 'Answer saved. It now waits for senior review.' : 'Answer cleared.');
  }
  if (act === 'verify') {
    // the answer stamp the reviewer is looking at; server refuses if the answer changed meanwhile
    const on = ((S.cache[S.month] || S.data).find(x => x.id === id) || {}).answeredOn || '';
    return mutate(id, o => {
      o.status = 'Verified'; o.verifiedBy = S.user.name; o.verifiedOn = nowStr(); o.remarks = '';
      o.stage = stageOf(o); return o;
    }, () => api('api_setStatus', S.auth, id, 'Verified', '', on), 'Marked as Resolved.');
  }
  if (act === 'return') {
    const rem = $('#rem-' + id).value.trim();
    if (!rem) return toast('Write a short reason for returning this answer.', true);
    const on = ((S.cache[S.month] || S.data).find(x => x.id === id) || {}).answeredOn || '';
    return mutate(id, o => {
      o.status = 'Unverified'; o.verifiedBy = ''; o.verifiedOn = ''; o.remarks = rem.slice(0, 1000);
      o.returnCount = (Number(o.returnCount) || 0) + 1;
      o.stage = stageOf(o); return o;
    }, () => api('api_setStatus', S.auth, id, 'Unverified', rem, on), 'Returned to the division.');
  }
  if (act === 'rk-view') { S.rkView = b.dataset.v; if (S.rkView === 'province') S.rkProv = ''; return renderRanking(); }
  if (act === 'rk-all') { S.rkMonths = S.months.slice(); return syncRank(); }
  if (act === 'rk-one') { S.rkMonths = [S.months.slice().sort().reverse()[0]]; return syncRank(); }
  if (act === 'rview') { S.rview = b.dataset.v; return renderReport(); }
  if (act === 'sec-all') { S.secMonths = S.months.slice(); return syncSec(); }
  if (act === 'sec-one') { S.secMonths = [S.months.slice().sort().reverse()[0]]; return syncSec(); }
  if (act === 'print') return printReport();
  if (act === 'csv') return downloadCsv();
}

 * ADD QUERY (Admin / CO) - MULTI SECTIONS AT ONCE

function renderAdd() {
  const divOptions = S.divisions.map(d => `<option value="${esc(d.division)}">${esc(d.division)} (${esc(d.province)})</option>`).join('');

  const secHtml = S.sections.map(s => `
    <div class="sec-box">
      <label>${esc(s)}</label>
      <textarea class="q-input" data-sec="${esc(s)}" dir="auto" placeholder="Leave blank if you don't want to add a query for this section..."></textarea>
    </div>
  `).join('');

  $('#view').innerHTML = `
    <h2>Add queries</h2>
    <p class="lede">Select a division, then write queries for the required sections. Sections left blank will be skipped automatically.</p>
    <form class="form" id="addForm">
      <div class="fgrid"><label for="addMonth">Month</label>
        <div><input id="addMonth" type="month" value="${esc(S.month)}" style="max-width:200px" required></div></div>

      <div class="fgrid"><label for="addDiv">Division</label>
        <div>
          <select id="addDiv" style="max-width:320px;" required>
            <option value="">-- Select a Division --</option>
            ${divOptions}
          </select>
        </div>
      </div>

      <div id="sectionsList" class="sec-list hidden">
        <h3 style="margin:0 0 16px; font-size:18px; color:var(--navy);">Write Queries Below</h3>
        ${secHtml}
        <div class="actions" style="margin-top:20px; position:sticky; bottom:10px; background:#fff; padding:10px 0; border-top:1px solid var(--line);">
          <button class="btn primary" type="submit" id="addBtn">Save All Queries</button>
          <span class="ok" id="addOk" role="status"></span>
        </div>
      </div>
    </form>`;

  // Show sections only when a division is selected
  $('#addDiv').onchange = (e) => {
    if (e.target.value) {
      $('#sectionsList').classList.remove('hidden');
    } else {
      $('#sectionsList').classList.add('hidden');
    }
  };

  $('#addForm').onsubmit = async ev => {
    ev.preventDefault();
    const month = $('#addMonth').value;
    const division = $('#addDiv').value;

    const queries = [];
    document.querySelectorAll('.q-input').forEach(ta => {
      const text = ta.value.trim();
      if (text) {
        queries.push({ section: ta.dataset.sec, text: text });
      }
    });

    if (!queries.length) {
      return toast('Please write a query in at least one section.', true);
    }
    if (!/^\d{4}-(0[1-9]|1[0-2])$/.test(month)) {
      return toast('Month ka format YYYY-MM hona chahiye (jaise 2026-10).', true);
    }
    const tooLong = queries.find(q => q.text.length > 2000);
    if (tooLong) {
      return toast('"' + tooLong.section + '" ki query bohot lambi hai (max 2000 characters).', true);
    }

    const addBtn = $('#addBtn');
    addBtn.disabled = true;
    addBtn.textContent = 'Checking…';
    const resetBtn = () => { addBtn.disabled = false; addBtn.textContent = 'Save All Queries'; };

    try {
      // fresh data from the server, so the check is not done on an old cache
      const fresh = await api('api_list', S.auth, month);
      S.cache[month] = fresh;
      const dups = queries
        .map(q => ({ section: q.section,
                     n: fresh.filter(o => o.division === division && o.section === q.section).length }))
        .filter(x => x.n > 0);
      if (dups.length) {
        const lines = dups.map(d => '• ' + d.section + ' (' + d.n + (d.n === 1 ? ' query' : ' queries') + ' pehle se hai)').join('\n');
        const ok = confirm(division + ' ke in sections mein ' + monthLabel(month) + ' ki queries pehle se maujood hain:\n\n' +
          lines + '\n\nPurani queries wahin rahengi aur nayi queries alag se add hongi. Kya aap phir bhi add karna chahte hain?');
        if (!ok) { resetBtn(); return; }
      }
    } catch (e) {
      toast(e.message, true);
      resetBtn();
      return;
    }

    addBtn.textContent = 'Saving…';
    await run(addBtn, async () => {
      const r = await api('api_addBulkQueries', S.auth, { month, division, queries });
      delete S.cache[month];                       // list changed, reload it when needed
      api('api_list', S.auth, month).then(l => { if (!S.cache[month]) S.cache[month] = l; }).catch(() => {});
      if (r.added && S.months.indexOf(month) < 0) { S.months.push(month); S.months.sort().reverse(); }
      if (r.added) S.month = month;

      const extra = r.skipped ? ' (' + r.skipped + ' skipped: duplicate ya ghalat section)' : '';
      if (!r.added) {
        $('#addOk').textContent = '';
        toast('Koi query add nahi hui' + extra, true);
      } else {
        // Reset textareas after successful save
        document.querySelectorAll('.q-input').forEach(ta => ta.value = '');
        $('#addOk').textContent = `Success! ${r.added} queries added.` + extra;
        setTimeout(() => $('#addOk').textContent = '', 6000);
        toast(`Successfully saved ${r.added} queries.` + extra);
      }
    });
    addBtn.textContent = 'Save All Queries';
  };
}

/* =====================================================================
 * REPORT (screen, print, CSV)
 * ===================================================================== */
function reportRows() {
  const months = secMonthList(), div = S.f.division || '', prov = S.f.province || '';
  const order = {};
  S.sections.forEach((n, i) => { order[n] = i; });
  const ord = n => order[n] == null ? 999 : order[n];
  const rows = [];
  months.forEach(m => (S.cache[m] || []).forEach(o => { if ((!div || o.division === div) && (!prov || provOf(o.division) === prov)) rows.push(o); }));
  return rows.sort((a, b) => (ord(a.section) - ord(b.section)) || b.month.localeCompare(a.month) || a.division.localeCompare(b.division));
}

function groupBySection(rows) {
  const g = {}, keys = [];
  rows.forEach(o => { if (!g[o.section]) { g[o.section] = []; keys.push(o.section); } g[o.section].push(o); });
  return { g: g, keys: keys };
}

/* CSV cell: quotes escaped, and text starting with = + - @ is neutralised so Excel cannot run it as a formula */
function csvCell(v) {
  let s = String(v == null ? '' : v);
  if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
  return '"' + s.replace(/"/g, '""') + '"';
}

function downloadCsv() {
  if (S.rview === 'section') return downloadSecCsv();
  if (!secEnsure()) return toast('Months are still loading. Try again in a moment.', true);
  const rows = reportRows();
  if (!rows.length) return toast('Nothing to download.', true);
  const head = ['Month', 'Division', 'Section', 'Query', 'Answer', 'Status', 'Stage', 'Query Date', 'Answered By',
                'Answered On', 'Resolved By', 'Resolved On', 'Senior Remarks', 'Times Returned'];
  const cell = csvCell;
  const lines = [head.map(cell).join(',')].concat(rows.map(o => [
    o.month, o.division, o.section, o.query, o.answer, o.status, STAGE[o.stage].label, o.queryDate,
    o.answeredBy, o.answeredOn, o.verifiedBy, o.verifiedOn, o.remarks, o.returnCount].map(cell).join(',')));
  const blob = new Blob(['\uFEFF' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'EMR_Compliance_' + secMonthList()[0] + (secMonthList().length > 1 ? '_to_' + secMonthList()[secMonthList().length - 1] : '') + ((S.f.division || S.f.province) ? '_' + (S.f.division || S.f.province).replace(/\s+/g, '') : '') + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
